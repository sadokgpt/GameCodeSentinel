name: GameCodeSentinel Bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: python scripts/bootstrap.py
      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import 1.3 source from reviewed archive"
            git push origin HEAD:main
          fi
  build-windows:
    needs: import-source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GameCodeSentinel app.py
      - name: Verify EXE
        shell: pwsh
        run: |
          & .\dist\GameCodeSentinel.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Executable smoke test failed" }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GameCodeSentinel-Windows-v1.3
          path: dist/GameCodeSentinel.exe
          if-no-files-found: error
          retention-days: 7

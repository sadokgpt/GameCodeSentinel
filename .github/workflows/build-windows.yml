name: Build Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'sentinel_ui.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'app.py'
      - 'sentinel_ui.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: write
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run all regression tests
        run: python -m pytest -q
      - name: Build native Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GameCodeSentinel app.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/GameCodeSentinel.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed with code $($process.ExitCode)" }
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/GameCodeSentinel.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  GameCodeSentinel.exe" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8
          Write-Host "SHA256: $hash"
      - name: Upload tested EXE and checksum
        uses: actions/upload-artifact@v7
        with:
          name: GameCodeSentinel-Windows-v1.5.0
          path: |
            dist/GameCodeSentinel.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent release for the first build of each version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path app.py -Pattern '^APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          $tag = "v$version"
          gh release view $tag --json url 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists: keeping existing assets"
          } else {
            gh release create $tag "dist/GameCodeSentinel.exe" "dist/SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "GameCode Sentinel $tag" --generate-notes
          }

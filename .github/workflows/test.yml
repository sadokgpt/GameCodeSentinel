name: Cross-platform Tests
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install full dependencies on Windows
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt pytest
      - name: Install runtime dependencies on Linux
        if: runner.os == 'Linux'
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'dateparser>=1.4.3,<2' 'filelock>=3.20,<4' pytest
      - name: Run regression suite
        run: python -m pytest -q
      - name: Check CLI startup
        run: python app.py --version
  scan-aion2:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install HTTP scanner
        run: python -m pip install requests beautifulsoup4 dateparser filelock
      - name: Scan AION 2 without notifications
        env:
          LOCALAPPDATA: ${{ runner.temp }}/GameCodeSentinelCI
        run: python app.py --check --headless --game "AION 2" --report-json scan-report.json
      - name: Print diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f scan-report.json ]; then
            cat scan-report.json
          else
            echo "No scan report available"
          fi
      - name: Show detected AION 2 candidates and source evidence
        if: always()
        run: python scripts/scan_diagnostic.py
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AION2-Live-Scan-Report
          path: |
            scan-report.json
            scan-candidates.json
          if-no-files-found: warn
          retention-days: 3

name: AION 2 Live Scan
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-scan.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install scanner libraries
        run: python -m pip install requests beautifulsoup4 dateparser
      - name: Live HTTP scan without notifications
        run: python app.py --check --headless --game "AION 2" --report-json scan-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AION2-Live-Scan-Report
          path: scan-report.json
          if-no-files-found: warn
          retention-days: 3

name: Cross-platform Tests
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install full dependencies on Windows
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt pytest
      - name: Install runtime dependencies on Linux
        if: runner.os == 'Linux'
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'dateparser>=1.2,<2' pytest
      - name: Run regression suite
        run: python -m pytest -q
      - name: Check CLI startup
        run: python app.py --version
